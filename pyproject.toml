
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "qcloudrl"
version = "0.1.0"
description = "Independent Quantum Cloud Reinforcement Learning Framework"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["qcloudrl*", "gym_env*"]
